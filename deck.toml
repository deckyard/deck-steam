[package]
name = "@skiffyard/steam"
version = "0.4.0"
description = "A thick, friendly layer over Valve's Steam Web API"
license = "LGPL-3.0-only"
authors = ["mplx <mplx@jennifer-lang.dev>"]
# The deck talks to store.steampowered.com, steamcommunity.com and the Web API
# over HTTPS. No `exec`: it shells out to nothing. No `sql`.
capabilities = ["net"]
keywords = ["steam", "valve", "games", "rest", "api"]

[package.urls]
deck = "https://raw.githubusercontent.com/skiffyard/deck-steam/main/deck.toml"
homepage = "https://github.com/skiffyard/deck-steam"
manual = "https://skiffyard.github.io/deck-steam/"

[engines]
jennifer = ">=0.28.0"
